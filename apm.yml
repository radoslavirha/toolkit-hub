name: toolkit-hub
version: 0.1.0
description: Agent skills for the @radoslavirha toolkit packages
license: MIT
repository: https://github.com/radoslavirha/toolkit-hub
targets:
  - claude
  - copilot
dependencies:
  apm: []
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: ${input:context7_api_key}

marketplace:
  owner:
    name: radoslavirha
    url: https://github.com/radoslavirha

  build:
    tagPattern: "@radoslavirha/{name}@{version}"

  outputs:
    claude: {}

  packages:
    - name: toolkit-adoption
      description: How to adopt @radoslavirha toolkit packages and their agent skills
      source: ./agents/adoption

    - name: tsed-platform
      description: Agent guidance for @radoslavirha/tsed-platform - server bootstrap and handlers
      source: ./tsed/platform

    - name: tsed-mongoose
      description: Agent guidance for @radoslavirha/tsed-mongoose - mapper and repository pattern
      source: ./tsed/mongoose

    - name: utils
      description: Agent guidance for @radoslavirha/utils - guards, model building and mapping
      source: ./packages/utils
