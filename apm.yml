name: toolkit-hub
version: 0.1.0
description: Agent skills for the @radoslavirha toolkit packages
license: MIT
repository: https://github.com/radoslavirha/toolkit-hub
targets:
  - claude
  - copilot
dependencies:
  apm: []
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
      headers:
        CONTEXT7_API_KEY: ${input:context7_api_key}

marketplace:
  owner:
    name: radoslavirha
    url: https://github.com/radoslavirha

  build:
    tagPattern: "@radoslavirha/{name}@{version}"

  outputs:
    claude: {}

  packages:
    - name: tsed-service
      description: How to assemble a Ts.ED service from the toolkit packages
      source: ./agents/tsed-service

    - name: toolkit-adoption
      description: How to adopt @radoslavirha toolkit packages and their agent skills
      source: ./agents/adoption

    - name: config-eslint
      description: Agent guidance for @radoslavirha/config-eslint - shared flat config
      source: ./config/config-eslint

    - name: config-tsdown
      description: Agent guidance for @radoslavirha/config-tsdown - dual ESM/CJS builds
      source: ./config/config-tsdown

    - name: config-typescript
      description: Agent guidance for @radoslavirha/config-typescript - shared tsconfig bases
      source: ./config/config-typescript

    - name: config-vitest
      description: Agent guidance for @radoslavirha/config-vitest - test config and coverage
      source: ./config/config-vitest

    - name: logger
      description: Agent guidance for @radoslavirha/logger - scoped structured logging
      source: ./packages/logger

    - name: redaction
      description: Agent guidance for @radoslavirha/redaction - compiled redaction profiles
      source: ./packages/redaction

    - name: tsed-logger
      description: Agent guidance for @radoslavirha/tsed-logger - DI logger and scopes
      source: ./tsed/logger

    - name: tsed-swagger
      description: Agent guidance for @radoslavirha/tsed-swagger - multi-version OpenAPI
      source: ./tsed/swagger

    - name: types
      description: Agent guidance for @radoslavirha/types - shared type helpers
      source: ./packages/types

    - name: tsed-common
      description: Agent guidance for @radoslavirha/tsed-common - models, serialization, validation
      source: ./tsed/common

    - name: tsed-configuration
      description: Agent guidance for @radoslavirha/tsed-configuration - schema-validated config
      source: ./tsed/configuration

    - name: tsed-platform
      description: Agent guidance for @radoslavirha/tsed-platform - server bootstrap and handlers
      source: ./tsed/platform

    - name: tsed-mongoose
      description: Agent guidance for @radoslavirha/tsed-mongoose - mapper and repository pattern
      source: ./tsed/mongoose

    - name: utils
      description: Agent guidance for @radoslavirha/utils - guards, model building and mapping
      source: ./packages/utils
