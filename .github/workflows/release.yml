name: Release packages to GitHub Packages

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Use pnpm 12
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12
          run_install: false
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com/
          scope: '@radoslavirha'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Temporary, need some workspace manager
      - name: Build workspaces
        run: pnpm build
      - name: Install APM CLI
        uses: microsoft/apm-action@v1
        with:
          setup-only: true
          apm-version: '0.28.0'
      # `pnpm run version` runs `apm pack`, which needs the dependency files
      # restored into the gitignored .agents/ and .claude/ dirs.
      - name: Install APM dependencies
        run: apm install
      - name: Create Release Pull Request and Publish to GitHub Packages
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm changeset publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
