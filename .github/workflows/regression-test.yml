---
name: Regression test

# Proves that a PR's changed specs fail without its source changes and pass
# with them — see scripts/check-regression-test.sh.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  regression:
    name: Regression test
    # Label changes only matter for the opt-out label.
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled')
      || github.event.label.name == 'no-regression-test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use pnpm 11
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Workspace packages resolve each other through dist/.
      - name: Build workspaces
        run: pnpm build
      - name: Check the regression test
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          ALLOW_NO_TEST: ${{ contains(github.event.pull_request.labels.*.name, 'no-regression-test') && '1' || '0' }}
        run: bash scripts/check-regression-test.sh "$BASE_BRANCH"
